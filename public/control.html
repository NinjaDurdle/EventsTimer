<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Control</title>
  <style>
    :root {
      --accent: #4f9cf9;
      --danger: #f95f4f;
      --success: #4fc978;
      --warning: #f9c74f;
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242838;
      --border: #2e3347;
      --text: #e8eaf0;
      --muted: #7b8197;
      --radius: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 10px 14px 0;
    }

    /* ── Page header ── */
    .page-header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 -14px; padding: 9px 14px 8px;
      border-bottom: 1px solid var(--border);
    }
    .page-header h1 { font-size: 1.05rem; font-weight: 700; color: var(--text); display:flex; align-items:center; gap:8px; }
    .page-header h1 img { height: 22px; width: auto; opacity: 0.9; }
    h2 { font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
         letter-spacing: 0.08em; color: var(--muted); }

    /* ── Three-column layout ── */
    .columns {
      display: flex;
      flex: 1;
      gap: 0;
      min-height: 0;
    }
    .col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 180px;
    }
    .col-timers   { flex: 2.2; }
    .col-controls { flex: 1.35; }
    .col-messages { flex: 1; }

    /* Resize handle between columns */
    .col-resizer {
      width: 8px;
      flex-shrink: 0;
      cursor: col-resize;
      background: transparent;
      position: relative;
      transition: background 0.15s;
      z-index: 10;
    }
    .col-resizer::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border);
      border-radius: 1px;
      transition: background 0.15s;
    }
    .col-resizer:hover::after,
    .col-resizer.resizing::after { background: var(--accent); }

    .col-head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 8px;
    }
    /* In arrange mode, column headers become draggable */
    /* TODO: revisit arrange mode visual — user wants something other than this border */
    .arrange-mode .col-head {
      cursor: grab;
      border-radius: 6px;
      outline: 1px solid rgba(79,156,249,0.45);
      outline-offset: 3px;
      user-select: none;
    }
    .arrange-mode .col-head:active { cursor: grabbing; }

    .col-scroll {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding: 0 12px;
    }
    /* Block layout gives reliable overflow-y scrolling; flex containers suppress scrollbars
       when height is derived from parent flex rules and children have flex-shrink: 0 */
    .col-scroll > * + * { margin-top: 10px; }
    .col-scroll::-webkit-scrollbar { width: 4px; }
    .col-scroll::-webkit-scrollbar-track { background: transparent; }
    .col-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Footer ── */
    .page-footer {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 -14px; padding: 6px 14px;
      border-top: 1px solid var(--border);
      gap: 10px;
    }
    #status { font-size: 0.72rem; color: var(--muted); }
    #status.connected    { color: var(--success); }
    #status.disconnected { color: var(--danger); }
    .footer-links { display: flex; gap: 14px; }
    .footer-link {
      font-size: 0.72rem; color: var(--muted); text-decoration: none;
      opacity: 0.55; transition: opacity 0.15s;
      display: flex; align-items: center; gap: 5px;
    }
    .footer-link:hover { opacity: 1; color: var(--accent); }
    .btn-arrange {
      font-size: 0.8rem; font-weight: 600; padding: 3px 10px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); border-radius: 6px; cursor: pointer;
      transition: all 0.15s; display: flex; align-items: center; gap: 5px;
    }
    .btn-arrange:hover { border-color: var(--accent); color: var(--accent); }
    .btn-arrange.active { border-color: var(--accent); color: var(--accent); background: rgba(79,156,249,0.1); }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      flex-shrink: 0;
    }

    /* ── Controls card — timer header ── */
    .timer-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }
    #active-timer-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    #mode-badge {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      flex-shrink: 0;
    }
    #big-timer {
      font-family: monospace;
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-variant-numeric: tabular-nums;
      text-align: center;
      letter-spacing: 0.04em;
      padding: 2px 0;
      transition: color 0.2s;
    }
    #big-timer.end { color: var(--danger); }
    #msg-active-strip {
      text-align: center;
      font-size: 0.7rem;
      color: var(--warning);
      overflow: hidden;
      max-height: 0;
      margin: 0;
      transition: max-height 0.2s ease, margin 0.2s ease;
    }
    #msg-active-strip:not(:empty) { max-height: 2em; margin-top: 3px; margin-bottom: 1px; }

    /* ── Transport ── */
    .transport {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .prev-next-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }
    button {
      padding: 6px 8px;
      border: none;
      border-radius: var(--radius);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.35; cursor: default; }
    .btn-play  { background: var(--success); color: #000; }
    .btn-stop  { background: var(--danger);  color: #fff; }
    .btn-reset { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-prev, .btn-next {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
    }
    .btn-play:hover  { filter: brightness(1.12); }
    .btn-stop:hover  { filter: brightness(1.12); }
    .btn-reset:hover { border-color: var(--text); }
    .btn-prev:hover, .btn-next:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Jog buttons ── */
    .jog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 6px;
    }
    .btn-jog {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px;
      font-size: 1.1rem;
    }
    .btn-jog:hover { border-color: var(--accent); color: var(--accent); }

    /* ── End behavior tabs ── */
    .end-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
    }
    .end-tab {
      padding: 2px;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .end-tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    .end-tab.active { background: var(--accent); border-color: var(--accent); color: #000; }
    .end-hint {
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      min-height: 1em;
    }

    /* ── Column header button ── */
    .col-head-btn {
      font-size: 0.9rem;
      font-weight: 600;
      padding: 2px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
    }
    .col-head-btn:hover { border-color: var(--accent); color: var(--accent); }
    .col-head-btn.active { border-color: var(--accent); color: var(--accent); }

    /* ── Timer list ── */
    .preset-list { display: flex; flex-direction: column; gap: 4px; }
    .preset-item {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: 6px;
      padding: 4px 4px 4px 8px;
      user-select: none;
      touch-action: none;
      position: relative;
    }
    .preset-item.preset-active {
      border-left-color: var(--accent);
      background: rgba(79, 156, 249, 0.12);
    }
    .preset-item.preset-next {
      border-left-color: var(--warning);
      background: rgba(249, 199, 79, 0.12);
    }
    .preset-item.dragging { opacity: 0.3; border-style: dashed; }
    /* Long-press charge visual */
    .preset-item.long-press-charging::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 6px;
      border: 1px solid var(--accent);
      opacity: 0;
      animation: chargeGlow 0.5s ease forwards;
      pointer-events: none;
    }
    @keyframes chargeGlow {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }

    .drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      box-shadow: 0 6px 24px rgba(0,0,0,0.55);
      white-space: nowrap;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: rotate(1.5deg);
      display: none;
    }
    .drag-ghost.active { display: block; }
    /* Horizontal variant for column drag */
    .drag-ghost.col-drag { transform: rotate(0deg) scale(0.9); opacity: 0.85; }

    .drop-indicator {
      position: fixed;
      height: 2px;
      pointer-events: none;
      z-index: 999;
      background: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--accent), 0 0 3px var(--accent);
      display: none;
    }
    .drop-indicator.active { display: block; }
    /* Column arrange — equalises widths during drag, hides resizers */
    .columns.arranging { gap: 8px; }
    .columns.arranging .col-resizer { display: none; }
    .columns.arranging .col { flex: 1; min-width: 120px; }

    /* Glowing placeholder that shows where dragged column will land */
    .col-placeholder {
      flex: 1;
      min-width: 120px;
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      background: rgba(79,156,249,0.07);
      box-shadow: 0 0 14px rgba(79,156,249,0.22), inset 0 0 14px rgba(79,156,249,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .col-placeholder-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      opacity: 0.55;
    }

    .drag-handle {
      color: var(--muted);
      font-size: 1rem;
      padding: 2px 4px;
      cursor: grab;
      display: none;
      flex-shrink: 0;
      line-height: 1;
    }
    .reorder-mode .drag-handle { display: block; }

    .preset-body {
      flex: 1;
      min-width: 0;
      padding: 2px 0;
    }
    .preset-name {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: text;
    }
    .preset-name:hover { color: var(--accent); }
    .preset-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .meta-sep { opacity: 0.4; }
    .meta-mode, .meta-time, .meta-endbehavior {
      cursor: pointer;
      border-radius: 3px;
      padding: 0 2px;
      transition: color 0.12s, background 0.12s;
    }
    .meta-mode:hover, .meta-time:hover, .meta-endbehavior:hover {
      color: var(--accent);
      background: rgba(79,156,249,0.12);
    }
    .meta-mode.locked { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

    /* Inline editors inside meta row */
    .meta-inline-select {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.75rem;
      padding: 1px 4px;
      cursor: pointer;
    }
    .meta-inline-select:focus { outline: none; }
    .meta-time-inputs {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .meta-time-input {
      width: 2.4em;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.75rem;
      font-family: monospace;
      text-align: center;
      padding: 1px 2px;
    }
    .meta-time-input:focus { outline: none; }
    .meta-time-sep { font-size: 0.75rem; color: var(--muted); }

    .preset-rename-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 2px 6px;
    }
    .preset-rename-input:focus { outline: none; }

    .preset-actions { display: flex; gap: 1px; flex-shrink: 0; }
    .preset-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      padding: 5px 7px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.12s, background 0.12s;
    }
    .preset-btn:hover { background: var(--surface); }
    .preset-btn.btn-setnext:hover  { color: var(--accent); }
    .preset-btn.btn-overwrite:hover { color: var(--success); }
    .preset-btn.btn-load:hover     { color: var(--accent); }
    .preset-btn.btn-del            { color: var(--danger); opacity: 0.6; }
    .preset-btn.btn-del:hover      { opacity: 1; }
    /* Set Next button active state (this item IS the next) */
    .preset-btn.btn-setnext.is-next { color: var(--warning); }

    /* Add timer button */
    .btn-add-row {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 100%;
      padding: 6px;
      border-radius: var(--radius);
    }
    .btn-add-row:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Message cards ── */
    #message-list { display: flex; flex-direction: column; gap: 10px; }
    .msg-card { padding: 8px 10px; }
    .msg-card.msg-active { border-color: var(--warning); background: rgba(249,199,79,0.08); }
    .msg-card-text {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 8px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      min-height: 52px;
      margin-bottom: 6px;
    }
    .msg-card-text:focus { outline: none; border-color: var(--accent); }
    .msg-card-text:hover { border-color: var(--accent); }
    .msg-card-footer { display: flex; gap: 6px; }
    .msg-card-btn {
      flex: 1;
      background: var(--accent);
      color: #000;
      border: 1px solid var(--accent);
    }
    .msg-card-btn:hover { filter: brightness(1.12); }
    .msg-card-btn.has-message { background: var(--warning); border-color: var(--warning); }
    .msg-card-del {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .msg-card-del:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Color slot selector ── */
    .color-slot-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      margin-bottom: 2px;
    }
    .slot-label { font-size: 0.65rem; color: var(--muted); flex-shrink: 0; }
    .slot-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      background: var(--surface2);
      transition: transform 0.1s;
      font-size: 0;
      line-height: 1;
    }
    .slot-dot:active { transform: scale(0.82); }
    .slot-dot.active { outline: 2px solid var(--text); outline-offset: 1.5px; }

    /* ── Session (parent) transport block ── */
    .session-transport {
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .session-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .session-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--success);
      opacity: 0.6;
      flex-shrink: 0;
    }
    .session-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--success);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-timer {
      font-family: monospace;
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
      font-variant-numeric: tabular-nums;
      text-align: center;
      letter-spacing: 0.04em;
      color: var(--success);
      padding: 2px 0;
    }
    .session-timer.end { color: var(--danger); }
    .btn-focus-toggle {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 5px;
      border: 1px solid rgba(79,199,120,0.4);
      background: none;
      color: var(--success);
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-focus-toggle:hover { background: rgba(79,199,120,0.12); }
    .btn-focus-toggle.focused {
      background: rgba(79,199,120,0.18);
      border-color: var(--success);
    }
    .btn-exit-session {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      padding: 2px 5px;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-exit-session:hover { color: var(--danger); }
    .session-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 8px 0 6px;
    }

    /* ── Jog section labels ── */
    .jog-label {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin: 6px 0 3px;
    }
    .jog-label.session-color { color: var(--success); opacity: 0.7; }

    /* ── Fire Next panel ── */
    .fire-next-panel { margin-top: 8px; }
    .btn-fire-next {
      width: 100%;
      background: var(--success);
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      padding: 8px;
      border: none;
      border-radius: var(--radius);
    }
    .btn-fire-next:hover { filter: brightness(1.12); }

    /* ── Child timer items ── */
    .preset-item.is-child {
      margin-left: 18px;
      border-left-color: var(--border);
    }
    .child-indent {
      color: var(--muted);
      font-size: 0.75rem;
      flex-shrink: 0;
      opacity: 0.5;
      line-height: 1;
      padding-right: 2px;
    }

    /* ── useParentRemaining toggle ── */
    .btn-snap-parent {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      font-size: 0.68rem;
      padding: 1px 5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .btn-snap-parent.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(79,156,249,0.1);
    }
    .btn-snap-parent:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Display/message slot chips ── */
    .slot-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.6rem;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.12s;
    }
    .slot-chip:hover { border-color: var(--accent); color: var(--accent); }
    .slot-chip.active { background: var(--accent); border-color: var(--accent); color: #000; }

    /* ── Hide number input spinners ── */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

    /* ── Narrow fallback ── */
    /* Switch columns to block layout so each col expands to its natural content height
       and body scrolls. Avoids flex-item min-height inference issues across browsers. */
    @media (max-width: 768px) {
      html, body { height: auto; overflow: auto; }
      .columns { display: block; }
      .col-scroll { overflow-y: visible; flex: none; }
      .col-resizer { display: none; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1><img src="icons/Logo.svg" alt=""> Control</h1>
  </div>

  <div class="columns">

    <!-- LEFT: Timer list -->
    <div class="col col-timers" data-col-id="timers">
      <div class="col-head">
        <h2>Timers</h2>
        <button class="col-head-btn" id="btn-reorder-toggle">⇅ Reorder</button>
      </div>
      <div class="col-scroll">
        <div class="preset-list" id="preset-list">
          <div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:12px 0;">
            No timers saved yet
          </div>
        </div>
        <button class="btn-add-row" id="btn-add-timer">+ Add Timer</button>
        <div style="height:4px;"></div>
      </div>
    </div>

    <div class="col-resizer" id="resizer-0"></div>

    <!-- CENTER: Controls -->
    <div class="col col-controls" data-col-id="controls">
      <div class="col-head"><h2>Controls</h2></div>
      <div class="col-scroll">

        <div class="card" id="transport-card">

          <!-- Session (parent) transport — visible when a child is foreground -->
          <div class="session-transport" id="session-transport" style="display:none">
            <div class="session-header">
              <span class="session-label">Session</span>
              <span class="session-name" id="session-name">—</span>
              <button class="btn-focus-toggle" id="btn-focus-toggle" title="Switch what the display shows">Display: Child</button>
              <button class="btn-exit-session" id="btn-exit-child" title="Exit session">✕</button>
            </div>
            <div class="session-timer" id="session-timer">--:--</div>
            <div class="jog-label session-color">Session jog</div>
            <div class="jog-grid" id="jog-parent">
              <button class="btn-jog" data-delta="5" data-target="parent">+5 min</button>
              <button class="btn-jog" data-delta="1" data-target="parent">+1 min</button>
              <button class="btn-jog" data-delta="-1" data-target="parent">−1 min</button>
              <button class="btn-jog" data-delta="-5" data-target="parent">−5 min</button>
            </div>
            <div class="jog-label">Both jog</div>
            <div class="jog-grid" id="jog-both">
              <button class="btn-jog" data-delta="5" data-target="both">+5 min</button>
              <button class="btn-jog" data-delta="1" data-target="both">+1 min</button>
              <button class="btn-jog" data-delta="-1" data-target="both">−1 min</button>
              <button class="btn-jog" data-delta="-5" data-target="both">−5 min</button>
            </div>
            <hr class="session-divider">
          </div>

          <!-- Child / standalone transport -->
          <div class="timer-header">
            <div id="active-timer-name">—</div>
            <div id="mode-badge">COUNTDOWN</div>
          </div>
          <div id="big-timer">00:00:00</div>
          <div id="msg-active-strip"></div>

          <div class="transport">
            <button class="btn-play"  id="btn-play"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6,3 20,12 6,21"/></svg> Start</button>
            <button class="btn-stop"  id="btn-stop"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg> Stop</button>
            <button class="btn-reset" id="btn-reset"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 1.5-5"/><polyline points="3,3 3,7 7,7"/></svg> Reset</button>
          </div>
          <div class="prev-next-row">
            <button class="btn-prev" id="btn-prev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="20,3 8,12 20,21"/><line x1="5" y1="3" x2="5" y2="21"/></svg> Prev</button>
            <button class="btn-next" id="btn-next">Next <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="4,3 16,12 4,21"/><line x1="19" y1="3" x2="19" y2="21"/></svg></button>
          </div>

          <!-- Fire Next panel — visible when child is at endReached and next sibling exists -->
          <div class="fire-next-panel" id="fire-next-panel" style="display:none">
            <button class="btn-fire-next" id="btn-fire-next">▶ Fire Next: <span id="fire-next-name">—</span></button>
          </div>

          <div class="jog-label" id="jog-child-label" style="display:none">Child jog</div>
          <div class="jog-grid" id="jog-child">
            <button class="btn-jog" data-delta="5" data-target="child">+5 min</button>
            <button class="btn-jog" data-delta="1" data-target="child">+1 min</button>
            <button class="btn-jog" data-delta="-1" data-target="child">−1 min</button>
            <button class="btn-jog" data-delta="-5" data-target="child">−5 min</button>
          </div>
        </div>

        <div class="card" id="end-behavior-card">
          <h2 style="margin-bottom:6px;">End Behavior</h2>
          <div class="end-tabs">
            <div class="end-tab active" data-behavior="hold">Hold</div>
            <div class="end-tab"        data-behavior="flash">Flash</div>
            <div class="end-tab"        data-behavior="load">Load Next</div>
            <div class="end-tab"        data-behavior="start">Start Next</div>
          </div>
          <div class="end-hint" id="end-hint"></div>
        </div>

        <div style="height:4px;"></div>
      </div>
    </div>

    <div class="col-resizer" id="resizer-1"></div>

    <!-- RIGHT: Messages -->
    <div class="col col-messages" data-col-id="messages">
      <div class="col-head"><h2>Messages</h2></div>
      <div class="col-scroll">
        <div id="message-list"></div>
        <button class="btn-add-row" id="btn-add-msg">+ Add Message</button>
        <div style="height:4px;"></div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="page-footer">
    <div class="footer-links">
      <span id="status">Connecting…</span>
      <a href="/admin" class="footer-link">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Admin
      </a>
      <a href="/display" class="footer-link" target="_blank">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><polyline points="14,6 18,6 18,10"/><line x1="18" y1="6" x2="13" y2="11"/></svg>
        Display
      </a>
    </div>
    <span style="font-size:0.65rem;color:var(--muted);opacity:0.5;">← Drag edges to resize</span>
    <button class="btn-arrange" id="btn-arrange">⊞ Arrange</button>
  </footer>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let ws;
    let latestState            = null;
    let latestPresets          = [];
    let latestColorSlots       = [
      { name: "Normal",  textColor: "#ffffff" },
      { name: "Good",    textColor: "#4fc978" },
      { name: "Warning", textColor: "#f9c74f" },
      { name: "Alert",   textColor: "#f95f4f" },
    ];
    let latestTimerDisplaySlots = [
      { name: "Default" }, { name: "Slot 2" }, { name: "Slot 3" }, { name: "Slot 4" },
    ];
    let latestMsgDisplaySlots = [
      { name: "Default" }, { name: "Slot B" }, { name: "Slot C" }, { name: "Slot D" },
    ];
    let latestParentContext = null;
    let latestDisplayFocus  = "foreground";
    let reconnectDelay      = 1000;
    let reorderMode    = false;
    let dragging       = null;        // timer item being dragged
    let dragJustEnded  = false;       // suppresses clicks after a drag completes
    let arrangeDragging    = null;    // column being dragged
    let arrangeMode        = false;
    let arrangeDragOrigIdx = -1;      // original index (0/1/2) of dragged col
    let arrangeOtherCols   = [];      // the 2 non-dragged cols at drag start, in DOM order

    const ICON = {
      save:   `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="11" height="13" rx="1.5"/><line x1="8" y1="4" x2="8" y2="17"/><line x1="16" y1="8" x2="20" y2="8"/><line x1="20" y1="8" x2="20" y2="19"/><polyline points="17,16 20,19 23,16"/></svg>`,
      upload: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><polyline points="14,3 14,8 19,8"/><line x1="8" y1="13" x2="16" y2="13"/><polyline points="13,10 16,13 13,16"/></svg>`,
      trash:  `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
    };

    // Shared drag ghost (used for both timer and column drags)
    const dragGhost = document.createElement("div");
    dragGhost.className = "drag-ghost";
    document.body.appendChild(dragGhost);

    // Horizontal drop indicator for timer list
    const dropIndicator = document.createElement("div");
    dropIndicator.className = "drop-indicator";
    document.body.appendChild(dropIndicator);

    // Placeholder column element (created once, moved around during arrange drag)
    const colPlaceholder = document.createElement("div");
    colPlaceholder.className = "col col-placeholder";
    colPlaceholder.innerHTML = `<span class="col-placeholder-label"></span>`;

    // DOM refs
    const statusEl      = document.getElementById("status");
    const btnPlay       = document.getElementById("btn-play");
    const bigTimer      = document.getElementById("big-timer");
    const modeBadge     = document.getElementById("mode-badge");
    const activeNameEl  = document.getElementById("active-timer-name");
    const msgStrip      = document.getElementById("msg-active-strip");
    const endCard       = document.getElementById("end-behavior-card");
    const endHint       = document.getElementById("end-hint");
    const endTabs       = document.querySelectorAll(".end-tab");
    const presetList    = document.getElementById("preset-list");

    // ── WebSocket ──────────────────────────────────────────────────────────────

    function connect() {
      try {
        ws = new WebSocket(`ws://${location.host}`);
      } catch(e) { console.warn("WS unavailable in preview:", e.message); return; }
      ws.addEventListener("open", () => {
        reconnectDelay = 1000;
        statusEl.textContent = "● Connected";
        statusEl.className   = "connected";
      });
      ws.addEventListener("message", (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "state") {
          latestState = msg.payload;
          renderState(msg.payload);
        } else if (msg.type === "presets") {
          latestPresets = msg.payload;
          renderPresets(msg.payload);
        }
      });
      ws.addEventListener("close", () => {
        statusEl.textContent = "● Disconnected — reconnecting…";
        statusEl.className   = "disconnected";
        setTimeout(connect, Math.min(reconnectDelay, 10000));
        reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
      });
      ws.addEventListener("error", () => ws.close());
    }

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    // ── Render state ───────────────────────────────────────────────────────────

    function renderState({ timer, display, messages, colorSlots, timerDisplaySlots, msgDisplaySlots, parentContext, displayFocus }) {
      if (Array.isArray(colorSlots))        latestColorSlots        = colorSlots;
      if (Array.isArray(timerDisplaySlots)) latestTimerDisplaySlots = timerDisplaySlots;
      if (Array.isArray(msgDisplaySlots))   latestMsgDisplaySlots   = msgDisplaySlots;
      latestParentContext = parentContext || null;
      latestDisplayFocus  = displayFocus  || "foreground";

      bigTimer.textContent = formatMs(timer.currentMs, display.showSubseconds);
      bigTimer.classList.toggle("end", timer.endReached);

      activeNameEl.textContent = timer.activePresetName || "—";
      modeBadge.textContent    = timer.mode === "external" ? "EXTERNAL" : timer.mode.toUpperCase();
      btnPlay.innerHTML = timer.running
        ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="4" x2="8" y2="20"/><line x1="16" y1="4" x2="16" y2="20"/></svg> Pause`
        : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6,3 20,12 6,21"/></svg> Start`;

      endTabs.forEach(t => t.classList.toggle("active", t.dataset.behavior === timer.endBehavior));

      if (timer.endBehavior === "load" || timer.endBehavior === "start") {
        const next = latestPresets.find(p => p.id === timer.nextPresetId);
        endHint.textContent = next ? `On-deck: "${next.name}"` : "Tap ⏭ on a timer to set on-deck";
      } else {
        endHint.textContent = "";
      }

      const isExternal = timer.mode === "external";
      endCard.style.display = isExternal ? "none" : "";

      // Active message strip — show all non-empty slots
      const activeMessages = Array.isArray(messages)
        ? messages.map((m, i) => m.text ? `${String.fromCharCode(65+i)}: ${m.text}` : null).filter(Boolean)
        : [];
      msgStrip.textContent = activeMessages.length
        ? `● ${activeMessages.join("  ·  ").slice(0, 80)}`
        : "";

      // Update message card active states
      syncMessageCardStates(messages);

      // Session transport block
      const sessionTransport = document.getElementById("session-transport");
      const fireNextPanel    = document.getElementById("fire-next-panel");
      const jogChildLabel    = document.getElementById("jog-child-label");
      if (parentContext) {
        sessionTransport.style.display = "";
        document.getElementById("session-name").textContent  = parentContext.name;
        const sessionTimerEl = document.getElementById("session-timer");
        sessionTimerEl.textContent = formatMs(parentContext.currentMs);
        sessionTimerEl.classList.toggle("end", parentContext.endReached);

        // Display focus toggle button
        const focusBtn = document.getElementById("btn-focus-toggle");
        const focused  = latestDisplayFocus === "parent";
        focusBtn.textContent = focused ? "Display: Session" : "Display: Child";
        focusBtn.classList.toggle("focused", focused);

        const childIdx = (parentContext.childIds || []).indexOf(timer.activePresetId);
        const hasNext  = childIdx >= 0 && childIdx < (parentContext.childIds || []).length - 1;
        if (timer.endReached && hasNext) {
          fireNextPanel.style.display = "";
          const nextChildId = parentContext.childIds[childIdx + 1];
          const nextChild   = latestPresets.find(p => p.id === nextChildId);
          document.getElementById("fire-next-name").textContent = nextChild ? nextChild.name : "Next";
        } else {
          fireNextPanel.style.display = "none";
        }

        // Show child-jog label when in session (disambiguates from session/both jog rows)
        jogChildLabel.style.display = "";
      } else {
        sessionTransport.style.display = "none";
        fireNextPanel.style.display    = "none";
        jogChildLabel.style.display    = "none";
      }

      // Prev/Next button states — navigate relative to parent when in nested context
      const topLevel = latestPresets.filter(p => !p.parentId);
      const refId    = parentContext ? parentContext.id : timer.activePresetId;
      const refIdx   = topLevel.findIndex(p => p.id === refId);
      document.getElementById("btn-prev").disabled = refIdx <= 0;
      document.getElementById("btn-next").disabled = parentContext
        ? refIdx < 0 || refIdx >= topLevel.length - 1
        : !timer.nextPresetId;

      // Update active/next highlighting without rebuilding the DOM
      syncPresetHighlights(timer.activePresetId, timer.nextPresetId, timer.running);
    }

    // ── Render timer list ──────────────────────────────────────────────────────

    // Lightweight highlight sync — called on every state tick.
    // Only touches CSS classes; never rebuilds DOM elements.
    function syncPresetHighlights(activeId, nextId, isRunning) {
      presetList.querySelectorAll(".preset-item").forEach(item => {
        const id = item.dataset.id;
        item.classList.toggle("preset-active", id === activeId);
        item.classList.toggle("preset-next",   id !== activeId && id === nextId);
        const modeSpan   = item.querySelector(".meta-mode");
        const setNextBtn = item.querySelector(".btn-setnext");
        if (modeSpan)   modeSpan.classList.toggle("locked", isRunning && id === activeId);
        if (setNextBtn) setNextBtn.classList.toggle("is-next", id === nextId);
      });
    }

    const MODE_LABELS = { countdown: "Countdown", countup: "Count Up", external: "External", clock: "Clock" };
    const END_LABELS  = { hold: "Hold", flash: "Flash", load: "Load Next", start: "Start Next" };

    function renderPresets(presets) {
      if (!presets.length) {
        presetList.innerHTML = `<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:12px 0;">No timers yet — add one below</div>`;
        return;
      }

      presetList.innerHTML = "";

      // Render top-level items; then render each parent's children directly below it
      const topLevel = presets.filter(p => !p.parentId);
      topLevel.forEach(p => {
        presetList.appendChild(buildPresetItem(p, false));
        // Render children in the order declared by parent.children[]
        const orderedChildren = (p.children || [])
          .map(id => presets.find(x => x.id === id))
          .filter(Boolean);
        orderedChildren.forEach(child => {
          presetList.appendChild(buildPresetItem(child, true));
        });
      });
    }

    function buildPresetItem(p, isChild) {
      const activeId     = latestState?.timer?.activePresetId;
      const nextId       = latestState?.timer?.nextPresetId;
      const isRunning    = latestState?.timer?.running;
      const isThisActive = p.id === activeId;
      const isThisRunning = isRunning && isThisActive;

      const item = document.createElement("div");
      item.className  = "preset-item" + (isChild ? " is-child" : "");
      item.dataset.id = p.id;

      if (isThisActive)       item.classList.add("preset-active");
      else if (p.id === nextId) item.classList.add("preset-next");

      const isParent = !isChild && Array.isArray(p.children) && p.children.length > 0;

      // Build inner HTML — child items have an indent glyph and no drag handle shown in reorder mode
      item.innerHTML = `
        ${isChild
          ? `<span class="child-indent">└</span>`
          : `<span class="drag-handle"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="9" cy="7" r="1.2"/><circle cx="15" cy="7" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="17" r="1.2"/><circle cx="15" cy="17" r="1.2"/></svg></span>`
        }
        <div class="preset-body">
          <div class="preset-name">${escHtml(p.name)}</div>
          <div class="preset-meta">
            <span class="meta-mode${isThisRunning ? " locked" : ""}"
                  title="${isThisRunning ? "Mode locked while running" : "Click to change mode"}"
            >${escHtml(MODE_LABELS[p.mode] || p.mode)}</span>
            <span class="meta-sep">·</span>
            ${isChild
              ? `<span class="meta-time" title="Click to edit time">${p.useParentRemaining ? "⟲ snap" : formatMs(p.targetMs)}</span>`
              : `<span class="meta-time" title="Click to edit time">${formatMs(p.targetMs)}</span>`
            }
            <span class="meta-sep">·</span>
            <span class="meta-endbehavior" title="Click to change end behavior">${escHtml(END_LABELS[p.endBehavior] || p.endBehavior)}</span>
          </div>
        </div>
        <div class="preset-actions">
          ${!isChild
            ? `<button class="preset-btn btn-setnext${p.id === nextId ? " is-next" : ""}" title="Set as on-deck">⏭</button>`
            : ""
          }
          <button class="preset-btn btn-overwrite" title="Overwrite with current state">${ICON.save}</button>
          <button class="preset-btn btn-load" title="${isChild ? "Fire this child" : isParent ? "Load session" : "Load to transport"}">${ICON.upload}</button>
          <button class="preset-btn btn-del" title="Delete">${ICON.trash}</button>
        </div>`;

      // ── Click on name → rename ──
      item.querySelector(".preset-name").addEventListener("click", (e) => {
        if (dragJustEnded) return;
        e.stopPropagation();
        startRename(item, p);
      });

      // ── Click on time → inline time editor (children snap toggle instead if useParentRemaining) ──
      item.querySelector(".meta-time").addEventListener("click", (e) => {
        if (dragJustEnded) return;
        e.stopPropagation();
        if (isChild && p.useParentRemaining) {
          // Toggle off — switch back to fixed time
          send({ type: "preset", payload: { action: "update", preset: { id: p.id, useParentRemaining: false } } });
          p.useParentRemaining = false;
          const span = item.querySelector(".meta-time");
          if (span) span.textContent = formatMs(p.targetMs);
        } else {
          startTimeEdit(item, p);
        }
      });

      // ── Click on mode → inline select (locked while running) ──
      item.querySelector(".meta-mode").addEventListener("click", (e) => {
        if (dragJustEnded) return;
        e.stopPropagation();
        if (isThisRunning) return;
        startMetaSelect(item, p, "mode", ".meta-mode", Object.keys(MODE_LABELS), MODE_LABELS);
      });

      // ── Click on end behavior → inline select ──
      item.querySelector(".meta-endbehavior").addEventListener("click", (e) => {
        if (dragJustEnded) return;
        e.stopPropagation();
        startMetaSelect(item, p, "endBehavior", ".meta-endbehavior", Object.keys(END_LABELS), END_LABELS);
      });

      // ── Set as on-deck (top-level only) ──
      item.querySelector(".btn-setnext")?.addEventListener("click", (e) => {
        e.stopPropagation();
        send({ type: "preset", payload: { action: "setActive", preset: { id: p.id } } });
      });

      // ── Overwrite ──
      item.querySelector(".btn-overwrite").addEventListener("click", (e) => {
        e.stopPropagation();
        send({ type: "preset", payload: { action: "overwrite", preset: { id: p.id } } });
      });

      // ── Load / Fire ──
      item.querySelector(".btn-load").addEventListener("click", (e) => {
        e.stopPropagation();
        send({ type: "preset", payload: { action: "load", preset: { id: p.id } } });
      });

      // ── Delete ──
      item.querySelector(".btn-del").addEventListener("click", (e) => {
        e.stopPropagation();
        const label = isParent ? `Delete session "${p.name}" and its ${(p.children||[]).length} child timer(s)?`
                                : `Delete timer "${p.name}"?`;
        if (confirm(label)) {
          send({ type: "preset", payload: { action: "delete", preset: { id: p.id } } });
        }
      });

      // Color slot picker appended to meta row
      const metaRow = item.querySelector(".preset-meta");
      const slotSep = document.createElement("span");
      slotSep.className   = "meta-sep";
      slotSep.textContent = "·";
      const slotPicker = buildColorSlotPicker(p.colorSlot ?? null, (slot) => {
        send({ type: "preset", payload: { action: "update", preset: { id: p.id, colorSlot: slot } } });
        p.colorSlot = slot;
      });
      metaRow.append(slotSep, slotPicker);

      // Timer display slot picker
      const dsSep = document.createElement("span");
      dsSep.className   = "meta-sep";
      dsSep.textContent = "·";
      const dsPicker = buildDisplaySlotPicker(p.displaySlot ?? 1, (slot) => {
        send({ type: "preset", payload: { action: "update", preset: { id: p.id, displaySlot: slot } } });
        p.displaySlot = slot;
      });
      metaRow.append(dsSep, dsPicker);

      // useParentRemaining toggle for child items (appended after color picker)
      if (isChild) {
        const snapSep = document.createElement("span");
        snapSep.className   = "meta-sep";
        snapSep.textContent = "·";
        const snapBtn = document.createElement("button");
        snapBtn.className = "btn-snap-parent" + (p.useParentRemaining ? " active" : "");
        snapBtn.title = "Use parent's remaining time as this child's duration (snapped at fire time)";
        snapBtn.textContent = "⟲ snap";
        snapBtn.addEventListener("pointerdown", e => e.stopPropagation());
        snapBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const newVal = !p.useParentRemaining;
          send({ type: "preset", payload: { action: "update", preset: { id: p.id, useParentRemaining: newVal } } });
          p.useParentRemaining = newVal;
          snapBtn.classList.toggle("active", newVal);
          const timeSpan = item.querySelector(".meta-time");
          if (timeSpan) timeSpan.textContent = newVal ? "⟲ snap" : formatMs(p.targetMs);
        });
        metaRow.append(snapSep, snapBtn);
      }

      // Last-child lock: show lock instead of snap toggle for the last child in the parent
      if (isChild) {
        const parentPreset  = latestPresets.find(x => x.id === p.parentId);
        const siblingIds    = parentPreset ? (parentPreset.children || []) : [];
        const isLast        = siblingIds.length > 0 && siblingIds[siblingIds.length - 1] === p.id;
        if (isLast) {
          // Replace the snap toggle (already appended) with a lock indicator
          const existingSnap = metaRow.querySelector(".btn-snap-parent");
          if (existingSnap) {
            const prevSep = existingSnap.previousSibling;
            if (prevSep && prevSep.classList && prevSep.classList.contains("meta-sep")) prevSep.remove();
            existingSnap.remove();
          }
          const lockSep = document.createElement("span");
          lockSep.className   = "meta-sep";
          lockSep.textContent = "·";
          const lockSpan = document.createElement("span");
          lockSpan.className = "btn-snap-parent active";
          lockSpan.title     = "Last child always runs until the session ends";
          lockSpan.textContent = "⏹ tied";
          lockSpan.style.pointerEvents = "none";
          metaRow.append(lockSep, lockSpan);
        }
      }

      // defaultDisplayFocus toggle for parent presets (top-level with children)
      if (isParent) {
        const focusSep = document.createElement("span");
        focusSep.className   = "meta-sep";
        focusSep.textContent = "·";
        const focusBtn = document.createElement("button");
        const currentFocus = p.defaultDisplayFocus || "foreground";
        focusBtn.className   = "btn-snap-parent" + (currentFocus === "parent" ? " active" : "");
        focusBtn.title       = "Default display when this session loads";
        focusBtn.textContent = currentFocus === "parent" ? "⊡ show session" : "⊡ show child";
        focusBtn.addEventListener("pointerdown", e => e.stopPropagation());
        focusBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const newFocus = (p.defaultDisplayFocus || "foreground") === "foreground" ? "parent" : "foreground";
          send({ type: "preset", payload: { action: "update", preset: { id: p.id, defaultDisplayFocus: newFocus } } });
          p.defaultDisplayFocus = newFocus;
          focusBtn.classList.toggle("active", newFocus === "parent");
          focusBtn.textContent = newFocus === "parent" ? "⊡ show session" : "⊡ show child";
        });
        metaRow.append(focusSep, focusBtn);
      }

      // Add Child button for parent items (top-level without a parent)
      if (!isChild) {
        const addChildSep = document.createElement("span");
        addChildSep.className   = "meta-sep";
        addChildSep.textContent = "·";
        const addChildBtn = document.createElement("button");
        addChildBtn.className   = "btn-snap-parent";
        addChildBtn.title       = "Add a child timer under this session";
        addChildBtn.textContent = "+ child";
        addChildBtn.addEventListener("pointerdown", e => e.stopPropagation());
        addChildBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const name = nextTimerName();
          send({ type: "preset", payload: { action: "save", preset: {
            name,
            mode:        "countdown",
            targetMs:    5 * 60 * 1000,
            endBehavior: "hold",
            colorSlot:   1,
            displaySlot: 1,
            parentId:    p.id,
            useParentRemaining: false,
          }}});
        });
        metaRow.append(addChildSep, addChildBtn);
      }

      // Only top-level items can be drag-reordered
      if (!isChild) initDrag(item);

      return item;
    }

    // ── Inline rename ──────────────────────────────────────────────────────────

    function startRename(item, preset) {
      const nameEl = item.querySelector(".preset-name");
      const input  = document.createElement("input");
      input.className = "preset-rename-input";
      input.value     = preset.name;
      nameEl.replaceWith(input);
      input.focus(); input.select();

      // Stop click events on input from bubbling to anything else
      input.addEventListener("click",     e => e.stopPropagation());
      input.addEventListener("mousedown", e => e.stopPropagation());

      let committed = false;
      function commit() {
        if (committed) return; committed = true;
        const name = input.value.trim() || preset.name;
        send({ type: "preset", payload: { action: "update", preset: { id: preset.id, name } } });
        const restored = document.createElement("div");
        restored.className   = "preset-name";
        restored.textContent = name;
        input.replaceWith(restored);
        preset.name = name;
        // Re-attach click handler on restored element
        restored.addEventListener("click", (e) => { if (dragJustEnded) return; e.stopPropagation(); startRename(item, preset); });
      }
      input.addEventListener("blur", commit);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter")  { e.preventDefault(); input.blur(); }
        if (e.key === "Escape") {
          committed = true;
          const restored = document.createElement("div");
          restored.className   = "preset-name";
          restored.textContent = preset.name;
          input.replaceWith(restored);
          restored.addEventListener("click", (e) => { if (dragJustEnded) return; e.stopPropagation(); startRename(item, preset); });
        }
      });
    }

    // ── Inline time editor ─────────────────────────────────────────────────────

    function startTimeEdit(item, preset) {
      const timeSpan = item.querySelector(".meta-time");
      const totalSec = Math.floor(preset.targetMs / 1000);
      const hh = Math.floor(totalSec / 3600);
      const mm = Math.floor((totalSec % 3600) / 60);
      const ss = totalSec % 60;

      const wrap = document.createElement("span");
      wrap.className = "meta-time-inputs";

      function makeInput(val, max) {
        const inp = document.createElement("input");
        inp.type      = "number";
        inp.className = "meta-time-input";
        inp.min       = 0;
        inp.max       = max;
        inp.value     = String(val).padStart(2, "0");
        inp.addEventListener("click",     e => e.stopPropagation());
        inp.addEventListener("mousedown", e => e.stopPropagation());
        inp.addEventListener("focus",     () => inp.select());
        return inp;
      }

      const inpH = makeInput(hh, 99);
      const inpM = makeInput(mm, 59);
      const inpS = makeInput(ss, 59);
      const sep1 = document.createElement("span"); sep1.className = "meta-time-sep"; sep1.textContent = ":";
      const sep2 = document.createElement("span"); sep2.className = "meta-time-sep"; sep2.textContent = ":";
      wrap.append(inpH, sep1, inpM, sep2, inpS);
      timeSpan.replaceWith(wrap);
      inpH.focus();

      let committed = false;
      function commit() {
        if (committed) return; committed = true;
        const h  = parseInt(inpH.value, 10) || 0;
        const m  = parseInt(inpM.value, 10) || 0;
        const s  = parseInt(inpS.value, 10) || 0;
        const ms = (h * 3600 + m * 60 + s) * 1000 || 0;
        send({ type: "preset", payload: { action: "update", preset: { id: preset.id, targetMs: ms } } });
        preset.targetMs = ms;
        const restored = document.createElement("span");
        restored.className = "meta-time";
        restored.title     = "Click to edit time";
        restored.textContent = formatMs(ms);
        wrap.replaceWith(restored);
        restored.addEventListener("click", (e) => { if (dragJustEnded) return; e.stopPropagation(); startTimeEdit(item, preset); });
      }

      // Commit on blur of any input (with small delay to allow tab between inputs)
      let blurTimer;
      [inpH, inpM, inpS].forEach(inp => {
        inp.addEventListener("blur", () => { blurTimer = setTimeout(commit, 150); });
        inp.addEventListener("focus", () => clearTimeout(blurTimer));
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter")  { e.preventDefault(); commit(); }
          if (e.key === "Escape") {
            committed = true;
            const restored = document.createElement("span");
            restored.className   = "meta-time";
            restored.title       = "Click to edit time";
            restored.textContent = formatMs(preset.targetMs);
            wrap.replaceWith(restored);
            restored.addEventListener("click", (e) => { if (dragJustEnded) return; e.stopPropagation(); startTimeEdit(item, preset); });
          }
        });
      });
    }

    // ── Inline meta select (mode or endBehavior) ───────────────────────────────

    function startMetaSelect(item, preset, field, selector, keys, labels) {
      const span = item.querySelector(selector);
      const sel  = document.createElement("select");
      sel.className = "meta-inline-select";
      keys.forEach(k => {
        const opt = document.createElement("option");
        opt.value = k; opt.textContent = labels[k];
        if (preset[field] === k) opt.selected = true;
        sel.appendChild(opt);
      });
      span.replaceWith(sel);
      sel.focus();

      sel.addEventListener("click",     e => e.stopPropagation());
      sel.addEventListener("mousedown", e => e.stopPropagation());

      function commit(newVal) {
        send({ type: "preset", payload: { action: "update", preset: { id: preset.id, [field]: newVal } } });
        preset[field] = newVal;
        const isThisRunning = latestState?.timer?.running && preset.id === latestState?.timer?.activePresetId;
        const restored = document.createElement("span");
        restored.className   = selector.slice(1) + (field === "mode" && isThisRunning ? " locked" : "");
        restored.title       = labels[preset[field]] ? "Click to change" : "";
        restored.textContent = labels[newVal] || newVal;
        sel.replaceWith(restored);
        restored.addEventListener("click", (e) => {
          if (dragJustEnded || restored.classList.contains("locked")) return;
          e.stopPropagation();
          startMetaSelect(item, preset, field, selector, keys, labels);
        });
      }

      sel.addEventListener("change", () => { commit(sel.value); });
      sel.addEventListener("blur",   () => { commit(sel.value); });
      sel.addEventListener("keydown", (e) => { if (e.key === "Escape") { commit(preset[field]); } });
    }

    // ── Drag-and-drop reorder ──────────────────────────────────────────────────

    function initDrag(item) {
      const handle = item.querySelector(".drag-handle");
      let pendingInsertBeforeId = null;
      let longPressTimer  = null;
      let longPressStartX = 0;
      let longPressLastX  = 0;
      let longPressLastY  = 0;
      let longPointerId   = null;
      let hasMoved        = false;

      // Safety net: if pointerup fires on a different element (pointer capture failed),
      // clean up the ghost so it doesn't stick around.
      function onDragSafetyUp() {
        document.removeEventListener("pointerup", onDragSafetyUp);
        if (dragging === item) {
          dragGhost.classList.remove("active");
          dropIndicator.classList.remove("active");
          item.classList.remove("dragging");
          dragging = null;
        }
      }

      function startDrag(pointerId, clientX, clientY) {
        dragging = item;
        hasMoved = false;
        pendingInsertBeforeId = null;
        try { item.setPointerCapture(pointerId); } catch {}
        item.classList.add("dragging");
        item.classList.remove("long-press-charging");
        const nameEl = item.querySelector(".preset-name");
        dragGhost.textContent = nameEl ? (nameEl.value || nameEl.textContent) : "…";
        dragGhost.classList.remove("col-drag");
        dragGhost.style.left = (clientX + 14) + "px";
        dragGhost.style.top  = (clientY - 12) + "px";
        dragGhost.classList.add("active");
        document.addEventListener("pointerup", onDragSafetyUp);
      }

      // Handle drag via reorder-mode handle
      handle.addEventListener("pointerdown", (e) => {
        if (!reorderMode) return;
        e.preventDefault();
        startDrag(e.pointerId, e.clientX, e.clientY);
      });

      // Long-press anywhere on the item for drag
      item.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".preset-actions")) return; // don't long-press on buttons
        if (reorderMode && e.target === handle) return;  // handled above
        if (dragging) return;
        longPointerId   = e.pointerId;
        longPressStartX = e.clientX;
        longPressLastX  = e.clientX;
        longPressLastY  = e.clientY;
        item.classList.add("long-press-charging");
        longPressTimer = setTimeout(() => {
          longPressTimer = null;
          dragJustEnded  = false;
          startDrag(longPointerId, longPressLastX, longPressLastY);
        }, 500);
      });

      item.addEventListener("pointermove", (e) => {
        longPressLastX = e.clientX;
        longPressLastY = e.clientY;
        // Cancel long-press if pointer moved significantly
        if (longPressTimer) {
          const dx = e.clientX - longPressStartX;
          const dy = e.clientY - longPressStartX;
          if (Math.sqrt(dx * dx + dy * dy) > 8) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
            item.classList.remove("long-press-charging");
          }
        }
        if (!dragging || dragging !== item) return;
        hasMoved = true;

        dragGhost.style.left = (e.clientX + 14) + "px";
        dragGhost.style.top  = (e.clientY - 12) + "px";

        const siblings = [...presetList.querySelectorAll(".preset-item:not(.dragging)")];
        let insertBefore = null, indicatorY = null;
        for (const sib of siblings) {
          const r = sib.getBoundingClientRect();
          if (e.clientY < r.top + r.height / 2) { insertBefore = sib; indicatorY = r.top; break; }
          indicatorY = r.bottom;
        }
        if (indicatorY === null) indicatorY = presetList.getBoundingClientRect().bottom;
        pendingInsertBeforeId = insertBefore ? insertBefore.dataset.id : null;

        const listRect = presetList.getBoundingClientRect();
        dropIndicator.style.top   = (indicatorY - 1) + "px";
        dropIndicator.style.left  = listRect.left + "px";
        dropIndicator.style.width = listRect.width + "px";
        dropIndicator.classList.add("active");
      });

      item.addEventListener("pointerup", () => {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        item.classList.remove("long-press-charging");
        document.removeEventListener("pointerup", onDragSafetyUp);

        if (!dragging || dragging !== item) return;
        dragGhost.classList.remove("active");
        dropIndicator.classList.remove("active");
        item.classList.remove("dragging");
        dragging = null;
        dragJustEnded = true;
        setTimeout(() => { dragJustEnded = false; }, 0);

        if (hasMoved) {
          if (pendingInsertBeforeId) {
            const sib = presetList.querySelector(`[data-id="${pendingInsertBeforeId}"]`);
            if (sib) presetList.insertBefore(item, sib); else presetList.appendChild(item);
          } else {
            presetList.appendChild(item);
          }
          pendingInsertBeforeId = null;
          const ids = [...presetList.querySelectorAll(".preset-item")].map(el => el.dataset.id);
          send({ type: "preset", payload: { action: "reorder", preset: { ids } } });
        }
      });

      item.addEventListener("pointercancel", () => {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        item.classList.remove("long-press-charging");
        document.removeEventListener("pointerup", onDragSafetyUp);
        if (dragging === item) {
          dragGhost.classList.remove("active");
          dropIndicator.classList.remove("active");
          item.classList.remove("dragging");
          dragging = null;
        }
      });
    }

    // ── Transport ──────────────────────────────────────────────────────────────

    btnPlay.addEventListener("click", () => {
      if (latestState && latestState.timer.running) {
        send({ type: "command", payload: { action: "pause" } });
      } else {
        send({ type: "command", payload: { action: "start" } });
      }
    });

    document.getElementById("btn-stop").addEventListener("click", () => {
      send({ type: "command", payload: { action: "stop" } });
      btnPlay.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6,3 20,12 6,21"/></svg> Start`;
    });

    document.getElementById("btn-reset").addEventListener("click", () =>
      send({ type: "command", payload: { action: "reset" } }));

    document.getElementById("btn-prev").addEventListener("click", () => {
      if (!latestState || !latestPresets.length) return;
      const topLevel = latestPresets.filter(p => !p.parentId);
      const refId = latestParentContext ? latestParentContext.id : latestState.timer.activePresetId;
      const idx   = topLevel.findIndex(p => p.id === refId);
      if (idx > 0) send({ type: "preset", payload: { action: "load", preset: { id: topLevel[idx - 1].id } } });
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      if (!latestState) return;
      if (latestParentContext) {
        const topLevel = latestPresets.filter(p => !p.parentId);
        const idx = topLevel.findIndex(p => p.id === latestParentContext.id);
        if (idx >= 0 && idx < topLevel.length - 1)
          send({ type: "preset", payload: { action: "load", preset: { id: topLevel[idx + 1].id } } });
      } else {
        const nextId = latestState.timer.nextPresetId;
        if (nextId) send({ type: "preset", payload: { action: "load", preset: { id: nextId } } });
      }
    });

    document.getElementById("btn-fire-next").addEventListener("click", () => {
      send({ type: "command", payload: { action: "fireNextChild" } });
    });

    document.getElementById("btn-exit-child").addEventListener("click", () => {
      send({ type: "command", payload: { action: "exitChildContext" } });
    });

    // ── Display focus toggle ────────────────────────────────────────────────────

    document.getElementById("btn-focus-toggle").addEventListener("click", () => {
      const next = latestDisplayFocus === "parent" ? "foreground" : "parent";
      send({ type: "command", payload: { action: "setDisplayFocus", focus: next } });
    });

    // ── Jog buttons ────────────────────────────────────────────────────────────
    // data-target: "child" (default), "parent", or "both"

    document.querySelectorAll(".btn-jog").forEach(btn => {
      btn.addEventListener("click", () => {
        const delta  = parseInt(btn.dataset.delta, 10);
        const target = btn.dataset.target || "child";
        const actionMap = { child: "adjust", parent: "adjustParent", both: "adjustBoth" };
        send({ type: "command", payload: { action: actionMap[target], deltaMs: delta * 60_000 } });
      });
    });

    // ── End behavior tabs ──────────────────────────────────────────────────────

    endTabs.forEach(tab => {
      tab.addEventListener("click", () =>
        send({ type: "command", payload: { action: "setEndBehavior", behavior: tab.dataset.behavior } }));
    });

    // ── Add timer ──────────────────────────────────────────────────────────────

    function nextTimerName() {
      const used = new Set();
      latestPresets.forEach(p => {
        const m = p.name.match(/^Timer (\d+)$/i);
        if (m) used.add(parseInt(m[1], 10));
      });
      let n = 1;
      while (used.has(n)) n++;
      return `Timer ${n}`;
    }

    document.getElementById("btn-add-timer").addEventListener("click", () => {
      const name = nextTimerName();
      send({ type: "preset", payload: { action: "save", preset: {
        name,
        mode:        "countdown",
        targetMs:    5 * 60 * 1000,
        endBehavior: "hold",
        colorSlot:   1,
        displaySlot: 1,
      }}});
    });

    // ── Message cards ──────────────────────────────────────────────────────────

    // randomId() is unavailable over plain HTTP (non-localhost).
    // Fall back to a simple random hex string that is collision-resistant enough
    // for local IDs on a single-operator device.
    function randomId() {
      if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
      return "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function getMessages() {
      try { return JSON.parse(localStorage.getItem("evt-messages") || "[]"); } catch { return []; }
    }
    function saveMessages(msgs) { localStorage.setItem("evt-messages", JSON.stringify(msgs)); }

    function renderMessageCards() {
      let msgs = getMessages();
      if (!msgs.length) { msgs = [{ id: randomId(), text: "" }]; saveMessages(msgs); }
      const list = document.getElementById("message-list");
      list.innerHTML = "";
      msgs.forEach(m => list.appendChild(buildMessageCard(m)));
      if (latestState) syncMessageCardStates(latestState.messages || []);
    }

    function syncMessageCardStates(messages) {
      const msgs = Array.isArray(messages) ? messages : [];
      document.querySelectorAll(".msg-card").forEach(card => {
        const cardText = card.querySelector(".msg-card-text").value.trim();
        const cardSlot = (parseInt(card.dataset.msgSlot, 10) || 1) - 1; // 0-indexed
        const slotMsg  = msgs[cardSlot];
        const slotText = (slotMsg ? slotMsg.text : "").trim();

        const isExact    = slotText.length > 0 && cardText === slotText;
        const isSameSlot = slotText.length > 0 && !isExact;

        card.classList.toggle("msg-active", isExact);
        const btn = card.querySelector(".msg-card-btn");
        btn.classList.toggle("has-message", isExact);
        btn.textContent = isExact ? "Clear" : isSameSlot ? "Replace" : "Send";
      });
    }

    function buildMessageCard(m) {
      const card = document.createElement("div");
      card.className = "msg-card card";
      card.dataset.msgId  = m.id;
      card.dataset.msgSlot = m.msgDisplaySlot || 1;

      const ta = document.createElement("textarea");
      ta.className = "msg-card-text";
      ta.placeholder = "Type a message…";
      ta.maxLength = 200;
      ta.value = m.text;
      ta.rows = 2;

      // Color + layout slot row
      const slotRow   = document.createElement("div");
      slotRow.className = "color-slot-row";
      const slotLabel = document.createElement("span");
      slotLabel.className   = "slot-label";
      slotLabel.textContent = "Color:";
      const slotPicker = buildColorSlotPicker(m.colorSlot ?? null, (slot) => {
        const msgs = getMessages();
        const idx  = msgs.findIndex(x => x.id === m.id);
        if (idx !== -1) { msgs[idx].colorSlot = slot; saveMessages(msgs); m.colorSlot = slot; }
        if (card.classList.contains("msg-active")) {
          send({ type: "command", payload: { action: "setMessage", text: ta.value.trim(), colorSlot: slot, msgDisplaySlot: m.msgDisplaySlot || 1 } });
        }
      });
      const layoutLabel = document.createElement("span");
      layoutLabel.className   = "slot-label";
      layoutLabel.textContent = "Layout:";
      const layoutPicker = buildMsgDisplaySlotPicker(m.msgDisplaySlot ?? 1, (slot) => {
        const msgs = getMessages();
        const idx  = msgs.findIndex(x => x.id === m.id);
        if (idx !== -1) { msgs[idx].msgDisplaySlot = slot; saveMessages(msgs); m.msgDisplaySlot = slot; }
        card.dataset.msgSlot = slot;
        if (card.classList.contains("msg-active")) {
          send({ type: "command", payload: { action: "setMessage", text: ta.value.trim(), colorSlot: m.colorSlot || null, msgDisplaySlot: slot } });
        }
      });
      slotRow.append(slotLabel, slotPicker, layoutLabel, layoutPicker);

      const footer = document.createElement("div");
      footer.className = "msg-card-footer";

      const btn = document.createElement("button");
      btn.className = "msg-card-btn";
      btn.textContent = "Send";

      const delBtn = document.createElement("button");
      delBtn.className = "msg-card-del";
      delBtn.innerHTML = ICON.trash;
      delBtn.title = "Remove card";

      footer.append(btn, delBtn);
      card.append(ta, slotRow, footer);

      ta.addEventListener("blur", () => {
        const msgs = getMessages();
        const idx  = msgs.findIndex(x => x.id === m.id);
        if (idx !== -1) { msgs[idx].text = ta.value; saveMessages(msgs); m.text = ta.value; }
      });

      btn.addEventListener("click", () => {
        const slot = m.msgDisplaySlot || 1;
        if (card.classList.contains("msg-active")) {
          send({ type: "command", payload: { action: "setMessage", text: "", msgDisplaySlot: slot } });
        } else {
          const text = ta.value.trim();
          if (text) send({ type: "command", payload: { action: "setMessage", text, colorSlot: m.colorSlot || null, msgDisplaySlot: slot } });
        }
      });

      delBtn.addEventListener("click", () => {
        const wasActive = card.classList.contains("msg-active");
        const slot = m.msgDisplaySlot || 1;
        saveMessages(getMessages().filter(x => x.id !== m.id));
        renderMessageCards();
        if (wasActive) send({ type: "command", payload: { action: "setMessage", text: "", msgDisplaySlot: slot } });
      });

      return card;
    }

    document.getElementById("btn-add-msg").addEventListener("click", () => {
      const msgs = getMessages();
      msgs.push({ id: randomId(), text: "" });
      saveMessages(msgs);
      renderMessageCards();
      const cards = document.querySelectorAll(".msg-card");
      if (cards.length) cards[cards.length - 1].querySelector(".msg-card-text").focus();
    });

    // ── Column resize ──────────────────────────────────────────────────────────

    function ensureAbsoluteWidths() {
      document.querySelectorAll(".col").forEach(col => {
        if (!col.style.flexBasis) {
          col.style.flexBasis = col.getBoundingClientRect().width + "px";
          col.style.flexGrow  = "0";
          col.style.flexShrink = "0";
        }
      });
    }

    function saveColWidths() {
      const widths = {};
      document.querySelectorAll(".col").forEach(col => {
        if (col.dataset.colId && col.style.flexBasis)
          widths[col.dataset.colId] = parseFloat(col.style.flexBasis);
      });
      localStorage.setItem("evt-col-widths", JSON.stringify(widths));
    }

    function loadColWidths() {
      try {
        const saved = JSON.parse(localStorage.getItem("evt-col-widths") || "{}");
        document.querySelectorAll(".col").forEach(col => {
          const w = saved[col.dataset.colId];
          if (w) { col.style.flexBasis = w + "px"; col.style.flexGrow = "0"; col.style.flexShrink = "0"; }
        });
      } catch {}
    }

    function initResizers() {
      document.querySelectorAll(".col-resizer").forEach(resizer => {
        // Remove old listeners by replacing the node
        const fresh = resizer.cloneNode(true);
        resizer.replaceWith(fresh);
        fresh.addEventListener("pointerdown", startResize);
      });
    }

    function startResize(e) {
      e.preventDefault();
      const resizer = e.currentTarget;
      resizer.setPointerCapture(e.pointerId);
      resizer.classList.add("resizing");

      const prev = resizer.previousElementSibling;
      const next = resizer.nextElementSibling;
      ensureAbsoluteWidths();

      const startX   = e.clientX;
      const prevW0   = parseFloat(prev.style.flexBasis) || prev.getBoundingClientRect().width;
      const nextW0   = parseFloat(next.style.flexBasis) || next.getBoundingClientRect().width;
      const MIN_W    = 180;

      resizer.addEventListener("pointermove", onMove);
      resizer.addEventListener("pointerup",   onUp);
      resizer.addEventListener("pointercancel", onUp);

      function onMove(e) {
        const dx      = e.clientX - startX;
        const newPrev = Math.max(MIN_W, Math.min(prevW0 + dx, prevW0 + nextW0 - MIN_W));
        const newNext = prevW0 + nextW0 - newPrev;
        prev.style.flexBasis = newPrev + "px";
        next.style.flexBasis = newNext + "px";
        saveColWidths();
      }
      function onUp() {
        resizer.classList.remove("resizing");
        resizer.removeEventListener("pointermove", onMove);
        resizer.removeEventListener("pointerup",   onUp);
        resizer.removeEventListener("pointercancel", onUp);
      }
    }

    // ── Column reorder (arrange mode) ─────────────────────────────────────────

    let _pendingColDropId = null;

    function getColOrder() {
      return [...document.querySelectorAll(".col")].map(c => c.dataset.colId);
    }

    function applyColumnOrder(order) {
      const columnsEl = document.querySelector(".columns");
      const colEls = {};
      document.querySelectorAll(".col").forEach(c => { colEls[c.dataset.colId] = c; });
      columnsEl.innerHTML = "";
      order.forEach((id, i) => {
        columnsEl.appendChild(colEls[id]);
        if (i < order.length - 1) {
          const r = document.createElement("div");
          r.className = "col-resizer";
          columnsEl.appendChild(r);
        }
      });
      initResizers();
      localStorage.setItem("evt-col-order", JSON.stringify(order));
    }

    // Module-level handlers so they can be added/removed from document
    function onColHeadPointerdown(e) {
      if (!arrangeMode) return;
      e.preventDefault(); // prevent text selection
      const col = e.currentTarget.closest(".col");
      if (!col || col.classList.contains("col-placeholder")) return;

      const columnsEl = document.querySelector(".columns");
      const allCols   = [...columnsEl.querySelectorAll(".col[data-col-id]")];
      arrangeDragging    = col.dataset.colId;
      arrangeDragOrigIdx = allCols.indexOf(col);
      arrangeOtherCols   = allCols.filter(c => c !== col);

      const colName = e.currentTarget.querySelector("h2")?.textContent || "";

      // Collapse dragged column out of layout so total width stays 3 columns worth,
      // and insert placeholder in its place so the slot stays visible
      colPlaceholder.querySelector(".col-placeholder-label").textContent = colName;
      col.before(colPlaceholder);
      col.style.cssText = "display: none";

      // Switch to equal-flex (hides resizers)
      columnsEl.classList.add("arranging");

      // Ghost label follows cursor
      dragGhost.textContent = colName;
      dragGhost.classList.add("col-drag");
      dragGhost.style.left = (e.clientX + 14) + "px";
      dragGhost.style.top  = (e.clientY - 12) + "px";
      dragGhost.classList.add("active");

      document.addEventListener("pointermove", onColArrangeMove);
      document.addEventListener("pointerup",   onColArrangeDrop);
    }

    function onColArrangeMove(e) {
      if (!arrangeDragging) return;
