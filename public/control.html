      // Clamp ghost so it never clips off the right edge of the viewport
      dragGhost.style.left = Math.min(e.clientX + 14, window.innerWidth - 220) + "px";
      dragGhost.style.top  = (e.clientY - 12) + "px";

      const columnsEl = document.querySelector(".columns");

      // Find where placeholder would land among the visible (non-dragged) cols
      // arrangeOtherCols was captured at drag start; dragged col is display:none
      let insertBefore = null;
      for (const c of arrangeOtherCols) {
        const r = c.getBoundingClientRect();
        if (e.clientX < r.left + r.width / 2) { insertBefore = c; break; }
      }

      if (insertBefore) {
        if (colPlaceholder.nextElementSibling !== insertBefore)
          columnsEl.insertBefore(colPlaceholder, insertBefore);
      } else {
        if (columnsEl.lastElementChild !== colPlaceholder)
          columnsEl.appendChild(colPlaceholder);
      }
    }

    function onColArrangeDrop() {
      document.removeEventListener("pointermove", onColArrangeMove);
      document.removeEventListener("pointerup",   onColArrangeDrop);
      dragGhost.classList.remove("active", "col-drag");

      if (!arrangeDragging) return;
      const wasArranging = arrangeDragging;
      arrangeDragging    = null;

      const columnsEl = document.querySelector(".columns");

      // Always restore the collapsed column's display first
      const draggedCol = columnsEl.querySelector(`.col[data-col-id="${wasArranging}"]`);
      if (draggedCol) draggedCol.style.cssText = "";

      // Read new order from DOM: placeholder position = dragged col's destination
      const newOrder = [];
      for (const child of columnsEl.children) {
        if (child.classList.contains("col-placeholder")) {
          newOrder.push(wasArranging);
        } else if (child.dataset?.colId && child.dataset.colId !== wasArranging) {
          newOrder.push(child.dataset.colId);
        }
      }

      colPlaceholder.remove();
      columnsEl.classList.remove("arranging");

      applyColumnOrder(newOrder);
      loadColWidths();
      initColArrange();
    }

    function initColArrange() {
      document.querySelectorAll(".col-head").forEach(head => {
        if (head.dataset.arrangeInit) return;
        head.dataset.arrangeInit = "1";
        head.addEventListener("pointerdown", onColHeadPointerdown);
      });
    }

    // ── Auto-exit modes on outside click ──────────────────────────────────────

    function exitReorderMode() {
      reorderMode = false;
      presetList.classList.remove("reorder-mode");
      const btn = document.getElementById("btn-reorder-toggle");
      if (btn) { btn.classList.remove("active"); btn.textContent = "⇅ Reorder"; }
    }

    function exitArrangeMode() {
      arrangeMode = false;
      document.querySelector(".columns").classList.remove("arrange-mode");
      const btn = document.getElementById("btn-arrange");
      if (btn) { btn.classList.remove("active"); btn.textContent = "⊞ Arrange"; }
    }

    document.addEventListener("pointerdown", (e) => {
      if (reorderMode && !e.target.closest("#preset-list") && !e.target.closest("#btn-reorder-toggle")) {
        exitReorderMode();
      }
      if (arrangeMode && !arrangeDragging && !e.target.closest(".col-head") && !e.target.closest("#btn-arrange")) {
        exitArrangeMode();
      }
    }, true);

    document.getElementById("btn-arrange").addEventListener("click", () => {
      if (arrangeMode) { exitArrangeMode(); return; }
      arrangeMode = true;
      document.querySelector(".columns").classList.add("arrange-mode");
      const btn = document.getElementById("btn-arrange");
      btn.classList.add("active");
      btn.textContent = "✓ Done";
    });

    document.getElementById("btn-reorder-toggle").addEventListener("click", () => {
      if (reorderMode) { exitReorderMode(); return; }
      reorderMode = true;
      presetList.classList.add("reorder-mode");
      const btn = document.getElementById("btn-reorder-toggle");
      btn.classList.add("active");
      btn.textContent = "✓ Done";
    });

    // ── Helpers ────────────────────────────────────────────────────────────────

    function formatMs(ms, showSubseconds = false) {
      const totalSec = Math.floor(ms / 1000);
      const hours    = Math.floor(totalSec / 3600);
      const minutes  = Math.floor((totalSec % 3600) / 60);
      const seconds  = totalSec % 60;
      const tenths   = Math.floor((ms % 1000) / 100);
      const hh = String(hours).padStart(2, "0");
      const mm = String(minutes).padStart(2, "0");
      const ss = String(seconds).padStart(2, "0");
      return showSubseconds ? `${hh}:${mm}:${ss}.${tenths}` : `${hh}:${mm}:${ss}`;
    }

    function escHtml(str) {
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                        .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }

    // ── Color slot picker ──────────────────────────────────────────────────────

    function buildColorSlotPicker(currentSlot, onChange) {
      const wrap = document.createElement("span");
      wrap.style.cssText = "display:inline-flex;align-items:center;gap:3px;";

      [1, 2, 3, 4].forEach((slot) => {
        const dot = document.createElement("button");
        dot.className = "slot-dot" + (currentSlot === slot ? " active" : "");
        const slotObj = latestColorSlots[slot - 1];
        dot.title = slotObj ? slotObj.name : `Color ${slot}`;
        if (slotObj && slotObj.textColor) dot.style.background = slotObj.textColor;
        dot.addEventListener("pointerdown", (e) => e.stopPropagation());
        dot.addEventListener("click", (e) => {
          e.stopPropagation();
          wrap.querySelectorAll(".slot-dot").forEach(d => d.classList.remove("active"));
          dot.classList.add("active");
          currentSlot = slot;
          onChange(slot);
        });
        wrap.appendChild(dot);
      });

      return wrap;
    }

    // ── Timer display slot picker ──────────────────────────────────────────────

    function buildDisplaySlotPicker(currentSlot, onChange) {
      const wrap = document.createElement("span");
      wrap.style.cssText = "display:inline-flex;align-items:center;gap:3px;";

      [1, 2, 3, 4].forEach((slot) => {
        const chip = document.createElement("button");
        chip.className = "slot-chip" + (currentSlot === slot ? " active" : "");
        const slotObj = latestTimerDisplaySlots[slot - 1];
        chip.title = slotObj ? slotObj.name : `Display ${slot}`;
        chip.textContent = String(slot);
        chip.addEventListener("pointerdown", (e) => e.stopPropagation());
        chip.addEventListener("click", (e) => {
          e.stopPropagation();
          wrap.querySelectorAll(".slot-chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          currentSlot = slot;
          onChange(slot);
        });
        wrap.appendChild(chip);
      });

      return wrap;
    }

    // ── Message display slot picker ────────────────────────────────────────────

    function buildMsgDisplaySlotPicker(currentSlot, onChange) {
      const wrap = document.createElement("span");
      wrap.style.cssText = "display:inline-flex;align-items:center;gap:3px;";

      [1, 2, 3, 4].forEach((slot) => {
        const chip = document.createElement("button");
        chip.className = "slot-chip" + (currentSlot === slot ? " active" : "");
        const slotObj = latestMsgDisplaySlots[slot - 1];
        chip.title = slotObj ? slotObj.name : `Layout ${String.fromCharCode(64 + slot)}`;
        chip.textContent = String.fromCharCode(64 + slot); // A=65, B=66...
        chip.addEventListener("pointerdown", (e) => e.stopPropagation());
        chip.addEventListener("click", (e) => {
          e.stopPropagation();
          wrap.querySelectorAll(".slot-chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          currentSlot = slot;
          onChange(slot);
        });
        wrap.appendChild(chip);
      });

      return wrap;
    }

    // ── Init ───────────────────────────────────────────────────────────────────

    loadColWidths();
    // Load saved column order if present
    try {
      const savedOrder = JSON.parse(localStorage.getItem("evt-col-order") || "null");
      if (savedOrder && Array.isArray(savedOrder) && savedOrder.length === 3) applyColumnOrder(savedOrder);
      else initResizers();
    } catch { initResizers(); }

    initColArrange();
    renderMessageCards();
    connect();
  </script>
</body>
