<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Control</title>
  <style>
    :root {
      --accent: #4f9cf9;
      --danger: #f95f4f;
      --success: #4fc978;
      --warning: #f9c74f;
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242838;
      --border: #2e3347;
      --text: #e8eaf0;
      --muted: #7b8197;
      --radius: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.1rem; font-weight: 600; color: var(--muted); }
    h2 { font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
         letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
    .admin-link {
      font-size: 0.72rem; color: var(--muted); text-decoration: none;
      opacity: 0.5; transition: opacity 0.15s;
    }
    .admin-link:hover { opacity: 1; color: var(--accent); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    /* Big timer */
    #big-timer {
      font-family: monospace;
      font-size: clamp(2.5rem, 12vw, 5rem);
      font-variant-numeric: tabular-nums;
      text-align: center;
      letter-spacing: 0.04em;
      padding: 12px 0;
      transition: color 0.2s;
    }
    #big-timer.end { color: var(--danger); }
    #mode-badge {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 4px;
    }
    /* Transport */
    .transport {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      padding: 12px 8px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.35; cursor: default; }
    .btn-play  { background: var(--success); color: #000; }
    .btn-stop  { background: var(--danger);  color: #fff; }
    .btn-reset { background: var(--surface2); color: var(--text);
                 border: 1px solid var(--border); }
    .btn-play:hover  { filter: brightness(1.12); }
    .btn-stop:hover  { filter: brightness(1.12); }
    .btn-reset:hover { border-color: var(--text); }
    /* Jog buttons */
    .jog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-jog {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 4px;
      font-size: 0.82rem;
    }
    .btn-jog:hover { border-color: var(--accent); color: var(--accent); }
    /* Mode tabs */
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
    }
    .mode-tab {
      padding: 8px;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .mode-tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    .mode-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }
    /* End behavior tabs */
    .end-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
    }
    .end-tab {
      padding: 8px 4px;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .end-tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    .end-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }
    .end-hint {
      margin-top: 8px;
      font-size: 0.68rem;
      color: var(--muted);
      text-align: center;
      min-height: 1em;
    }
    /* Time setter */
    .time-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .time-field label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 4px;
      text-align: center;
    }
    .time-field input {
      width: 100%;
      text-align: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1.4rem;
      font-family: monospace;
      padding: 8px 4px;
    }
    .time-field input:focus { outline: none; border-color: var(--accent); }
    .btn-set {
      width: 100%;
      margin-top: 10px;
      background: var(--accent);
      color: #000;
    }
    /* Message section */
    .message-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 60px;
      margin-bottom: 8px;
    }
    .message-input:focus { outline: none; border-color: var(--accent); }
    .message-input:hover { border-color: var(--accent); }
    .message-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-send  { background: var(--accent); color: #000; border: 1px solid var(--accent); }
    .btn-send.has-message { background: var(--warning); border-color: var(--warning); }
    .btn-send:hover { filter: brightness(1.12); }
    .btn-clear { background: var(--surface2); border: 1px solid var(--border);
                 color: var(--text); }
    .btn-clear:hover { border-color: var(--danger); color: var(--danger); }
    #msg-active {
      font-size: 0.7rem;
      color: var(--warning);
      margin-top: 6px;
      min-height: 1em;
    }
    /* Collapses to nothing when empty; smoothly expands when a message is showing */
    #msg-active-top {
      text-align: center;
      font-size: 0.7rem;
      color: var(--warning);
      overflow: hidden;
      max-height: 0;
      margin: 0;
      transition: max-height 0.2s ease, margin 0.2s ease;
    }
    #msg-active-top:not(:empty) {
      max-height: 2em;
      margin-top: 4px;
      margin-bottom: 6px;
    }
    /* Presets */
    .preset-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .btn-reorder-toggle {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
    }
    .btn-reorder-toggle.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
    .preset-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: 6px;
      padding: 8px 6px 8px 10px;
      user-select: none;
      touch-action: none;
    }
    .preset-item.preset-active {
      border-left-color: var(--accent);
      background: rgba(79, 156, 249, 0.15);
    }
    .preset-item.preset-next {
      border-left-color: var(--warning);
      background: rgba(249, 199, 79, 0.15);
    }
    .preset-item.dragging {
      opacity: 0.3;
      border-style: dashed;
    }
    /* Drag ghost — floating name label that follows the cursor */
    .drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      box-shadow: 0 6px 24px rgba(0,0,0,0.55);
      white-space: nowrap;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: rotate(1.5deg);
      display: none;
    }
    .drag-ghost.active { display: block; }
    /* Drop indicator — glowing line between items */
    .drop-indicator {
      position: fixed;
      height: 2px;
      pointer-events: none;
      z-index: 999;
      background: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--accent), 0 0 3px var(--accent);
      display: none;
    }
    .drop-indicator.active { display: block; }
    .drag-handle {
      color: var(--muted);
      font-size: 1rem;
      padding: 2px 4px;
      cursor: grab;
      display: none;
      flex-shrink: 0;
      line-height: 1;
    }
    .reorder-mode .drag-handle { display: block; }
    .preset-body {
      flex: 1;
      min-width: 0;
      cursor: pointer;
      padding: 2px 0;
    }
    .reorder-mode .preset-body { cursor: default; }
    .preset-name {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .preset-meta { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
    .preset-rename-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 2px 6px;
    }
    .preset-rename-input:focus { outline: none; }
    .preset-actions {
      display: flex;
      gap: 1px;
      flex-shrink: 0;
    }
    .preset-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      padding: 5px 7px;
      border-radius: 5px;
      transition: color 0.12s, background 0.12s;
    }
    .preset-btn:hover { background: var(--surface); }
    .preset-btn.btn-rename:hover   { color: var(--accent); }
    .preset-btn.btn-overwrite:hover { color: var(--success); }
    .preset-btn.btn-load:hover     { color: var(--accent); }
    .preset-btn.btn-del:hover      { color: var(--danger); }
    /* Save new preset */
    .save-row { display: flex; gap: 8px; }
    .save-row input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.88rem;
    }
    .save-row input:focus { outline: none; border-color: var(--accent); }
    .btn-save {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
    }
    .btn-save:hover { border-color: var(--accent); color: var(--accent); }
    /* Status */
    #status {
      font-size: 0.7rem; color: var(--muted);
      text-align: center; margin-top: 8px;
    }
    #status.connected    { color: var(--success); }
    #status.disconnected { color: var(--danger); }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>⏱ Timer Control</h1>
    <a href="/admin" class="admin-link">⚙ Admin</a>
  </div>

  <!-- Live timer + transport -->
  <div class="card">
    <div id="mode-badge">COUNTDOWN</div>
    <div id="big-timer">00:00:00</div>
    <div id="msg-active-top"></div>

    <div class="mode-tabs" style="margin-bottom:12px;">
      <div class="mode-tab active" data-mode="countdown">Countdown</div>
      <div class="mode-tab"       data-mode="external">External</div>
      <div class="mode-tab"       data-mode="countup">Count Up</div>
      <div class="mode-tab"       data-mode="clock">Clock</div>
    </div>

    <div class="transport">
      <button class="btn-play"  id="btn-play">▶ Start</button>
      <button class="btn-stop"  id="btn-stop">⏹ Stop</button>
      <button class="btn-reset" id="btn-reset">↺ Reset</button>
    </div>

    <div class="jog-grid">
      <button class="btn-jog" data-delta="5">+5 min</button>
      <button class="btn-jog" data-delta="1">+1 min</button>
      <button class="btn-jog" data-delta="-1">−1 min</button>
      <button class="btn-jog" data-delta="-5">−5 min</button>
    </div>
  </div>

  <!-- End behavior (hidden in external mode) -->
  <div class="card" id="end-behavior-card">
    <h2>End Behavior</h2>
    <div class="end-tabs">
      <div class="end-tab active" data-behavior="hold">Hold</div>
      <div class="end-tab"       data-behavior="flash">Flash</div>
      <div class="end-tab"       data-behavior="load">Load Next</div>
      <div class="end-tab"       data-behavior="start">Start Next</div>
    </div>
    <div class="end-hint" id="end-hint"></div>
  </div>

  <!-- Set time (hidden in clock / external mode) -->
  <div class="card" id="set-time-card">
    <h2>Set Time</h2>
    <div class="time-inputs">
      <div class="time-field">
        <label>HH</label>
        <input type="number" id="inp-hours" min="0" max="99" value="0">
      </div>
      <div class="time-field">
        <label>MM</label>
        <input type="number" id="inp-minutes" min="0" max="59" value="5">
      </div>
      <div class="time-field">
        <label>SS</label>
        <input type="number" id="inp-seconds" min="0" max="59" value="0">
      </div>
    </div>
    <button class="btn-set" id="btn-set">Set Time</button>
  </div>

  <!-- Message -->
  <div class="card">
    <h2>Message</h2>
    <textarea class="message-input" id="msg-input"
              placeholder="Type a message to display below the timer…"
              maxlength="200"></textarea>
    <div class="message-btns">
      <button class="btn-send"  id="btn-send-msg">Send</button>
      <button class="btn-clear" id="btn-clear-msg">Clear</button>
    </div>
    <div id="msg-active"></div>
  </div>

  <!-- Presets -->
  <div class="card">
    <div class="preset-header">
      <h2 style="margin-bottom:0;">Presets</h2>
      <button class="btn-reorder-toggle" id="btn-reorder-toggle">⇅ Reorder</button>
    </div>
    <div class="preset-list" id="preset-list">
      <div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:12px 0;">
        No presets saved yet
      </div>
    </div>
    <div class="save-row">
      <input type="text" id="preset-name" placeholder="Name new preset…" maxlength="40">
      <button class="btn-save" id="btn-save-preset">Save</button>
    </div>
  </div>

  <div id="status">Connecting…</div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let ws;
    let latestState   = null;
    let latestPresets = [];
    let reconnectDelay = 1000;
    let reorderMode   = false;
    let dragging      = null;

    // Drag ghost and drop indicator — created once, shared across all items
    const dragGhost = document.createElement("div");
    dragGhost.className = "drag-ghost";
    document.body.appendChild(dragGhost);

    const dropIndicator = document.createElement("div");
    dropIndicator.className = "drop-indicator";
    document.body.appendChild(dropIndicator);

    const statusEl   = document.getElementById("status");
    const btnPlay    = document.getElementById("btn-play");
    const bigTimer   = document.getElementById("big-timer");
    const modeBadge  = document.getElementById("mode-badge");
    const setCard    = document.getElementById("set-time-card");
    const endCard    = document.getElementById("end-behavior-card");
    const endHint    = document.getElementById("end-hint");
    const modeTabs   = document.querySelectorAll(".mode-tab");
    const endTabs    = document.querySelectorAll(".end-tab");
    const msgActive  = document.getElementById("msg-active");
    const presetList = document.getElementById("preset-list");

    // ── WebSocket ──────────────────────────────────────────────────────────────

    function connect() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.addEventListener("open", () => {
        reconnectDelay = 1000;
        statusEl.textContent = "● Connected";
        statusEl.className   = "connected";
      });
      ws.addEventListener("message", (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "state") {
          latestState = msg.payload;
          renderState(msg.payload);
        } else if (msg.type === "presets") {
          latestPresets = msg.payload;
          renderPresets(msg.payload);
        }
      });
      ws.addEventListener("close", () => {
        statusEl.textContent = "● Disconnected — reconnecting…";
        statusEl.className   = "disconnected";
        setTimeout(connect, Math.min(reconnectDelay, 10000));
        reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
      });
      ws.addEventListener("error", () => ws.close());
    }

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    // ── Rendering ──────────────────────────────────────────────────────────────

    function renderState({ timer, display }) {
      bigTimer.textContent = formatMs(timer.currentMs, display.showSubseconds);
      bigTimer.classList.toggle("end", timer.endReached);

      modeBadge.textContent = timer.mode === "external" ? "EXTERNAL SOURCE" : timer.mode.toUpperCase();
      btnPlay.textContent   = timer.running ? "⏸ Pause" : "▶ Start";

      modeTabs.forEach(t => t.classList.toggle("active", t.dataset.mode === timer.mode));
      endTabs.forEach(t  => t.classList.toggle("active", t.dataset.behavior === timer.endBehavior));

      // End hint — show on-deck preset name for load/start behaviors
      if (timer.endBehavior === "load" || timer.endBehavior === "start") {
        const next = latestPresets.find(p => p.id === timer.nextPresetId);
        endHint.textContent = next
          ? `On-deck: "${next.name}"`
          : "Tap a preset below to set it as on-deck";
      } else {
        endHint.textContent = "";
      }

      // Hide cards for modes where they don't apply
      const isExternal = timer.mode === "external";
      const isClock    = timer.mode === "clock";
      endCard.style.display  = isExternal ? "none" : "";
      setCard.style.display  = (isExternal || isClock) ? "none" : "";

      // Active message indicator + send button state
      const hasMsg = !!(timer.message && timer.message.trim());
      const msgText = hasMsg
        ? `● Showing: "${timer.message.slice(0, 40)}${timer.message.length > 40 ? "…" : ""}"`
        : "";
      msgActive.textContent    = msgText;
      document.getElementById("msg-active-top").textContent = msgText;

      const sendBtn = document.getElementById("btn-send-msg");
      sendBtn.classList.toggle("has-message", hasMsg);
      sendBtn.textContent = hasMsg ? "Update" : "Send";

      // Re-render presets so active/on-deck highlights stay current
      if (latestPresets.length && !presetList.querySelector(".preset-rename-input")) {
        renderPresets(latestPresets);
      }
    }

    function endBehaviorLabel(b) {
      return { hold: "Hold", flash: "Flash", load: "Load Next", start: "Start Next" }[b] || b;
    }

    function renderPresets(presets) {
      if (!presets.length) {
        presetList.innerHTML = `<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:12px 0;">No presets saved yet</div>`;
        return;
      }

      const activeId = latestState?.timer?.activePresetId;
      const nextId   = latestState?.timer?.nextPresetId;

      presetList.innerHTML = "";

      presets.forEach(p => {
        const item = document.createElement("div");
        item.className  = "preset-item";
        item.dataset.id = p.id;

        if (p.id === activeId)      item.classList.add("preset-active");
        else if (p.id === nextId)   item.classList.add("preset-next");

        item.innerHTML = `
          <span class="drag-handle">≡</span>
          <div class="preset-body">
            <div class="preset-name">${escHtml(p.name)}</div>
            <div class="preset-meta">${p.mode} · ${formatMs(p.targetMs)} · ${endBehaviorLabel(p.endBehavior)}</div>
          </div>
          <div class="preset-actions">
            <button class="preset-btn btn-rename"    title="Rename">✏</button>
            <button class="preset-btn btn-overwrite" title="Overwrite with current state">💾</button>
            <button class="preset-btn btn-load"      title="Load to transport">↑</button>
            <button class="preset-btn btn-del"       title="Delete">✕</button>
          </div>`;

        // Tap body → set as on-deck (nextPresetId)
        item.querySelector(".preset-body").addEventListener("click", () => {
          if (reorderMode) return;
          send({ type: "preset", payload: { action: "setActive", preset: { id: p.id } } });
        });

        item.querySelector(".btn-rename").addEventListener("click", (e) => {
          e.stopPropagation();
          startRename(item, p);
        });

        item.querySelector(".btn-overwrite").addEventListener("click", (e) => {
          e.stopPropagation();
          send({ type: "preset", payload: { action: "overwrite", preset: { id: p.id } } });
        });

        item.querySelector(".btn-load").addEventListener("click", (e) => {
          e.stopPropagation();
          send({ type: "preset", payload: { action: "load", preset: { id: p.id } } });
        });

        item.querySelector(".btn-del").addEventListener("click", (e) => {
          e.stopPropagation();
          if (confirm(`Delete preset "${p.name}"?`)) {
            send({ type: "preset", payload: { action: "delete", preset: { id: p.id } } });
          }
        });

        initDrag(item);
        presetList.appendChild(item);
      });
    }

    // ── Inline rename ──────────────────────────────────────────────────────────

    function startRename(item, preset) {
      const nameEl = item.querySelector(".preset-name");
      const input  = document.createElement("input");
      input.className = "preset-rename-input";
      input.value     = preset.name;
      nameEl.replaceWith(input);
      input.focus();
      input.select();

      let committed = false;
      function commitRename() {
        if (committed) return;
        committed = true;
        const name = input.value.trim() || preset.name;
        send({ type: "preset", payload: { action: "rename", preset: { id: preset.id, name } } });
        const restored = document.createElement("div");
        restored.className   = "preset-name";
        restored.textContent = name;
        input.replaceWith(restored);
        preset.name = name;
      }

      input.addEventListener("blur", commitRename);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter")  { e.preventDefault(); input.blur(); }
        if (e.key === "Escape") {
          committed = true; // prevent blur from committing
          const restored = document.createElement("div");
          restored.className   = "preset-name";
          restored.textContent = preset.name;
          input.replaceWith(restored);
        }
      });
    }

    // ── Drag-and-drop reorder (pointer events — works on mouse + touch) ────────

    function initDrag(item) {
      const handle = item.querySelector(".drag-handle");
      let pendingInsertBeforeId = null;

      function cancelDrag() {
        if (!dragging || dragging !== item) return;
        dragGhost.classList.remove("active");
        dropIndicator.classList.remove("active");
        item.classList.remove("dragging");
        dragging = null;
        pendingInsertBeforeId = null;
      }

      handle.addEventListener("pointerdown", (e) => {
        if (!reorderMode) return;
        e.preventDefault();
        dragging = item;
        pendingInsertBeforeId = null;
        item.setPointerCapture(e.pointerId);
        item.classList.add("dragging");

        // Ghost shows just the preset name
        const nameEl = item.querySelector(".preset-name");
        dragGhost.textContent = nameEl ? nameEl.textContent : "…";
        dragGhost.style.left = (e.clientX + 14) + "px";
        dragGhost.style.top  = (e.clientY - 12) + "px";
        dragGhost.classList.add("active");
      });

      item.addEventListener("pointermove", (e) => {
        if (!dragging || dragging !== item) return;

        // Move ghost with pointer
        dragGhost.style.left = (e.clientX + 14) + "px";
        dragGhost.style.top  = (e.clientY - 12) + "px";

        // Find the insertion point — don't move the DOM yet, just show the line
        const siblings = [...presetList.querySelectorAll(".preset-item:not(.dragging)")];
        let insertBefore = null;
        let indicatorY   = null;

        for (const sib of siblings) {
          const r = sib.getBoundingClientRect();
          if (e.clientY < r.top + r.height / 2) {
            insertBefore = sib;
            indicatorY   = r.top;
            break;
          }
          indicatorY = r.bottom;
        }

        // Edge case: list is empty aside from dragging item
        if (indicatorY === null) {
          indicatorY = presetList.getBoundingClientRect().bottom;
        }

        pendingInsertBeforeId = insertBefore ? insertBefore.dataset.id : null;

        // Position the drop indicator line
        const listRect = presetList.getBoundingClientRect();
        dropIndicator.style.top   = (indicatorY - 1) + "px";
        dropIndicator.style.left  = listRect.left + "px";
        dropIndicator.style.width = listRect.width + "px";
        dropIndicator.classList.add("active");
      });

      item.addEventListener("pointerup", () => {
        if (!dragging || dragging !== item) return;

        dragGhost.classList.remove("active");
        dropIndicator.classList.remove("active");
        item.classList.remove("dragging");
        dragging = null;

        // Apply the reorder in the DOM
        if (pendingInsertBeforeId) {
          const sibling = presetList.querySelector(`[data-id="${pendingInsertBeforeId}"]`);
          if (sibling) presetList.insertBefore(item, sibling);
          else         presetList.appendChild(item);
        } else {
          presetList.appendChild(item);
        }
        pendingInsertBeforeId = null;

        const ids = [...presetList.querySelectorAll(".preset-item")].map(el => el.dataset.id);
        send({ type: "preset", payload: { action: "reorder", preset: { ids } } });
      });

      // Clean up if pointer is interrupted (e.g. touch cancelled)
      item.addEventListener("pointercancel", cancelDrag);
    }

    // ── Reorder toggle ─────────────────────────────────────────────────────────

    document.getElementById("btn-reorder-toggle").addEventListener("click", () => {
      reorderMode = !reorderMode;
      presetList.classList.toggle("reorder-mode", reorderMode);
      const btn = document.getElementById("btn-reorder-toggle");
      btn.classList.toggle("active", reorderMode);
      btn.textContent = reorderMode ? "✓ Done" : "⇅ Reorder";
    });

    // ── Transport ──────────────────────────────────────────────────────────────

    btnPlay.addEventListener("click", () => {
      if (latestState && latestState.timer.running) {
        send({ type: "command", payload: { action: "pause" } });
      } else {
        send({ type: "command", payload: { action: "start" } });
      }
    });

    document.getElementById("btn-stop").addEventListener("click", () => {
      send({ type: "command", payload: { action: "stop" } });
      btnPlay.textContent = "▶ Start";
    });

    document.getElementById("btn-reset").addEventListener("click", () =>
      send({ type: "command", payload: { action: "reset" } }));

    // ── Jog buttons ────────────────────────────────────────────────────────────

    document.querySelectorAll(".btn-jog").forEach(btn => {
      btn.addEventListener("click", () => {
        const delta = parseInt(btn.dataset.delta, 10);
        send({ type: "command", payload: { action: "adjust", deltaMs: delta * 60_000 } });
      });
    });

    // ── Set time ───────────────────────────────────────────────────────────────

    document.getElementById("btn-set").addEventListener("click", () => {
      const h = parseInt(document.getElementById("inp-hours").value,   10) || 0;
      const m = parseInt(document.getElementById("inp-minutes").value, 10) || 0;
      const s = parseInt(document.getElementById("inp-seconds").value, 10) || 0;
      send({ type: "command", payload: { action: "setTime", ms: (h * 3600 + m * 60 + s) * 1000 } });
    });

    // ── Mode tabs ──────────────────────────────────────────────────────────────

    modeTabs.forEach(tab => {
      tab.addEventListener("click", () =>
        send({ type: "command", payload: { action: "setMode", mode: tab.dataset.mode } }));
    });

    // ── End behavior tabs ──────────────────────────────────────────────────────

    endTabs.forEach(tab => {
      tab.addEventListener("click", () =>
        send({ type: "command", payload: { action: "setEndBehavior", behavior: tab.dataset.behavior } }));
    });

    // ── Message ────────────────────────────────────────────────────────────────

    document.getElementById("btn-send-msg").addEventListener("click", () => {
      const text = document.getElementById("msg-input").value.trim();
      send({ type: "command", payload: { action: "setMessage", text } });
    });

    document.getElementById("btn-clear-msg").addEventListener("click", () => {
      document.getElementById("msg-input").value = "";
      send({ type: "command", payload: { action: "setMessage", text: "" } });
    });

    // ── Save new preset ────────────────────────────────────────────────────────

    document.getElementById("btn-save-preset").addEventListener("click", () => {
      const nameInput = document.getElementById("preset-name");
      const name = nameInput.value.trim() || "Untitled";
      if (!latestState) return;
      const { timer, display } = latestState;
      send({ type: "preset", payload: { action: "save", preset: {
        name,
        mode:          timer.mode,
        targetMs:      timer.targetMs,
        endBehavior:   timer.endBehavior,
        displayConfig: { ...display },
      }}});
      nameInput.value = "";
    });

    // ── Helpers ────────────────────────────────────────────────────────────────

    function formatMs(ms, showSubseconds = false) {
      const totalSec = Math.floor(ms / 1000);
      const hours    = Math.floor(totalSec / 3600);
      const minutes  = Math.floor((totalSec % 3600) / 60);
      const seconds  = totalSec % 60;
      const tenths   = Math.floor((ms % 1000) / 100);
      const hh = String(hours).padStart(2, "0");
      const mm = String(minutes).padStart(2, "0");
      const ss = String(seconds).padStart(2, "0");
      return showSubseconds ? `${hh}:${mm}:${ss}.${tenths}` : `${hh}:${mm}:${ss}`;
    }

    function escHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }

    connect();
  </script>
</body>
</html>
